<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 – Page not found</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8eaff; --ink:#2a2850; --muted:#6a6892; --face:#fff3ef; --blush:#ff9eb5;
  --tear:#7fd0ff; --accent:#4b48c9; --btn-text:#fff; --line:#cfd2f5;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#16152e;--ink:#f0eeff;--muted:#a5a2cf;--face:#ffe9e4;--accent:#8e8cff;--btn-text:#16152e;--line:#35336a;color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow-x:hidden}
main{max-width:640px;width:100%}
.num{display:flex;align-items:flex-end;justify-content:center;gap:clamp(0px,1vw,12px)}
.num span{font:700 clamp(96px,26vw,210px)/0.9 'Fredoka',system-ui,sans-serif;color:var(--ink);letter-spacing:-.02em}
.char{width:clamp(110px,30vw,230px);height:auto;overflow:visible;animation:sway 5s ease-in-out infinite;transform-origin:50% 100%}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.tear{fill:var(--tear);opacity:0;animation:drip 2.4s ease-in infinite}
.tear.r{animation-delay:1.1s}
@keyframes drip{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.95;transform:translateY(4px) scale(1)}85%{opacity:.9;transform:translateY(62px) scale(1)}100%{opacity:0;transform:translateY(70px) scale(.7)}}
.lip{animation:wob 1.6s ease-in-out infinite;transform-origin:100px 150px}
@keyframes wob{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.94)}}
.shadow{fill:var(--ink);opacity:.12}
h1{font:700 clamp(26px,5vw,38px)/1.15 'Fredoka',system-ui,sans-serif;margin:20px 0 10px}
p{margin:0 auto 28px;max-width:46ch;color:var(--muted);font-size:1.05rem;line-height:1.55}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{font:600 1rem 'Nunito',system-ui,sans-serif;display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:14px;border:2px solid var(--accent);cursor:pointer;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.primary{background:var(--accent);color:var(--btn-text)}
.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
@media (prefers-reduced-motion:reduce){.char,.tear,.lip{animation:none}.tear{opacity:.9}}
</style>
</head>
<body>
<main>
  <div class="num" aria-hidden="true">
    <span>4</span>
    <svg class="char" viewBox="0 0 200 230" xmlns="http://www.w3.org/2000/svg">
      <ellipse class="shadow" cx="100" cy="222" rx="62" ry="7"/>
      <!-- cat ears -->
      <path d="M32 78 L40 14 L88 44 Z" fill="var(--face)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M168 78 L160 14 L112 44 Z" fill="var(--face)" stroke="var(--ink)" stroke-width="5" stroke-linejoin="round"/>
      <path d="M46 62 L48 34 L72 48 Z" fill="var(--blush)"/>
      <path d="M154 62 L152 34 L128 48 Z" fill="var(--blush)"/>
      <!-- head -->
      <ellipse cx="100" cy="126" rx="88" ry="90" fill="var(--face)" stroke="var(--ink)" stroke-width="5"/>
      <!-- sad brows -->
      <path d="M44 74 Q60 70 78 80" stroke="var(--ink)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M156 74 Q140 70 122 80" stroke="var(--ink)" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- eyes -->
      <ellipse cx="64" cy="112" rx="24" ry="29" fill="#fff" stroke="var(--ink)" stroke-width="4"/>
      <ellipse cx="136" cy="112" rx="24" ry="29" fill="#fff" stroke="var(--ink)" stroke-width="4"/>
      <g class="pupil" id="pl"><ellipse cx="64" cy="118" rx="16" ry="21" fill="#3b3a8f"/><ellipse cx="64" cy="122" rx="9" ry="12" fill="#1c1b4a"/><circle cx="58" cy="108" r="7" fill="#fff"/><circle cx="70" cy="126" r="3.5" fill="#fff"/></g>
      <g class="pupil" id="pr"><ellipse cx="136" cy="118" rx="16" ry="21" fill="#3b3a8f"/><ellipse cx="136" cy="122" rx="9" ry="12" fill="#1c1b4a"/><circle cx="130" cy="108" r="7" fill="#fff"/><circle cx="142" cy="126" r="3.5" fill="#fff"/></g>
      <!-- watery lower lids -->
      <path d="M42 126 Q64 142 86 126" stroke="var(--tear)" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
      <path d="M114 126 Q136 142 158 126" stroke="var(--tear)" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"/>
      <!-- blush -->
      <ellipse cx="38" cy="152" rx="14" ry="8" fill="var(--blush)" opacity=".7"/>
      <ellipse cx="162" cy="152" rx="14" ry="8" fill="var(--blush)" opacity=".7"/>
      <!-- tears -->
      <path class="tear" d="M54 138 q-7 11 0 16 q7 -5 0 -16z"/>
      <path class="tear r" d="M146 138 q-7 11 0 16 q7 -5 0 -16z"/>
      <!-- wobbly frown -->
      <path class="lip" d="M84 168 Q92 158 100 166 Q108 158 116 168" stroke="var(--ink)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>4</span>
  </div>
  <h1>Oh no, this page got lost</h1>
  <p>We couldn't find the page at this address. It may have moved, or the link might have a typo. Head back home or return to where you were.</p>
  <div class="actions">
    <a class="btn primary" href="/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Go home
    </a>
    <button class="btn ghost" onclick="history.length>1?history.back():location.assign('/')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
      Go back
    </button>
  </div>
</main>
<script>
(function(){
  var svg=document.querySelector('.char'),pl=document.getElementById('pl'),pr=document.getElementById('pr');
  function look(x,y){
    var r=svg.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    var dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy)||1,m=Math.min(7,d/30);
    var t='translate('+(dx/d*m).toFixed(1)+'px,'+(dy/d*m*.7).toFixed(1)+'px)';
    pl.style.transform=t;pr.style.transform=t;
  }
  addEventListener('pointermove',function(e){look(e.clientX,e.clientY)});
  addEventListener('touchmove',function(e){var t=e.touches[0];look(t.clientX,t.clientY)},{passive:true});
})();
</script>
</body>
</html>
